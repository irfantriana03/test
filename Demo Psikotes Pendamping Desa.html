<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Demo Psikotes Pendamping Desa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@500;600;700&display=swap">
<style>
/* Konsep: aplikasi CBT yang tenang. Bilah atas biru tua, kartu putih di atas abu kebiruan,
   satu aksen cerulean untuk pilihan terpilih. Tampilan panitia memakai bilah abu-arang agar jelas terpisah. */
:root{
  --bg:#EBEFF5; --surface:#FFFFFF; --surface-2:#F4F6FA;
  --ink:#0F2342; --ink-2:#47576F; --line:#D3DAE6; --line-strong:#AEBBD0;
  --navy:#14305C; --on-navy:#FFFFFF;
  --bar:#0F2342; --on-bar:#EAF0FA; --bar-staff:#26303C; --stamp-bar:#FFD166;
  --accent:#0B7A9B; --on-accent:#FFFFFF; --accent-tint:#E0F1F6; --accent-ink:#065A74; --accent-ring:rgba(11,122,155,.28);
  --ok:#25703A; --ok-bg:#E1F2E4;
  --warn:#85560A; --warn-bg:#FFF0CC; --warn-line:#D9A100;
  --bad:#A8231B; --bad-bg:#FCE6E3; --alert:#B3261E;
  --shadow:0 1px 2px rgba(15,35,66,.08),0 6px 20px rgba(15,35,66,.06);
  --font-body:"Atkinson Hyperlegible",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-head:"IBM Plex Sans",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1325; --surface:#111E38; --surface-2:#0D182E;
    --ink:#E7EEFA; --ink-2:#A6B4CE; --line:#25365A; --line-strong:#3D5280;
    --navy:#2F62B0; --on-navy:#FFFFFF;
    --bar:#0C1830; --on-bar:#E7EEFA; --bar-staff:#1B2430; --stamp-bar:#FFD166;
    --accent:#46C3E6; --on-accent:#04222D; --accent-tint:#10394A; --accent-ink:#9BE0F4; --accent-ring:rgba(70,195,230,.35);
    --ok:#74D087; --ok-bg:#12331B;
    --warn:#F2C14E; --warn-bg:#3A2B08; --warn-line:#C99A1A;
    --bad:#FF9188; --bad-bg:#40181A; --alert:#C93A32;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1325; --surface:#111E38; --surface-2:#0D182E;
  --ink:#E7EEFA; --ink-2:#A6B4CE; --line:#25365A; --line-strong:#3D5280;
  --navy:#2F62B0; --on-navy:#FFFFFF;
  --bar:#0C1830; --on-bar:#E7EEFA; --bar-staff:#1B2430; --stamp-bar:#FFD166;
  --accent:#46C3E6; --on-accent:#04222D; --accent-tint:#10394A; --accent-ink:#9BE0F4; --accent-ring:rgba(70,195,230,.35);
  --ok:#74D087; --ok-bg:#12331B;
  --warn:#F2C14E; --warn-bg:#3A2B08; --warn-line:#C99A1A;
  --bad:#FF9188; --bad-bg:#40181A; --alert:#C93A32;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--font-body);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:clamp(16px,3vw,32px)}
.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* Bilah atas */
.topbar{background:var(--bar);color:var(--on-bar)}
.tb{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-block:12px}
.tb-id{display:flex;flex-direction:column;min-width:0}
.tb-eyebrow{font:700 .72rem var(--font-head);letter-spacing:.12em;text-transform:uppercase;opacity:.78}
.tb-title{font:600 1.1rem var(--font-head)}
.tb-right{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.demo{display:inline-flex;align-items:center;padding:4px 10px;border:1.5px dashed var(--stamp-bar);color:var(--stamp-bar);border-radius:6px;font:700 .74rem var(--font-head);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.modebtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;border:1.5px solid rgba(234,240,250,.55);background:transparent;color:var(--on-bar);font:600 .95rem var(--font-head)}
.modebtn:hover{background:rgba(234,240,250,.12)}
.app[data-mode="panitia"] .topbar{background:var(--bar-staff)}

.stage{padding-block:24px 110px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.eyebrow{font:700 .76rem var(--font-head);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}

/* Tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:12px;border:2px solid var(--line-strong);background:var(--surface);color:var(--ink);font:600 1.05rem var(--font-head);transition:border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.primary:hover:not(:disabled){filter:brightness(1.14)}
.btn.lg{min-height:60px;font-size:1.15rem;padding:0 30px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.flagbtn[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}

/* A. Beranda */
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:24px;align-items:start}
.hello h1{font-size:1.8rem;margin-block:6px 18px}
.idl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin:0}
.idl dt{color:var(--ink-2)}
.idl dd{margin:0;font-weight:700}
.idl .mono{font-family:var(--font-mono);font-weight:600}
.status{display:inline-flex;padding:2px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:.9rem}
.tests{display:flex;flex-direction:column;gap:18px}
.tcard{display:grid;grid-template-columns:auto 1fr;gap:6px 20px}
.tstep{grid-row:span 3;display:grid;place-items:center;width:56px;height:56px;border-radius:14px;background:var(--navy);color:var(--on-navy);font:700 1.5rem var(--font-head)}
.tcard h2{font-size:1.35rem}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.fact{padding:3px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:.92rem}
.tcard ul{margin:6px 0 0;padding-left:20px;color:var(--ink-2)}
.tcard li{margin-block:2px}
.startrow{display:flex;flex-wrap:wrap;align-items:center;gap:16px}

/* B & E. Petunjuk */
.ins{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.ins h1{font-size:1.7rem;margin-block:6px 18px}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:r}
.rules li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;counter-increment:r}
.rules li::before{content:counter(r);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent-tint);color:var(--accent-ink);font:700 1rem var(--font-head)}
.rules b{font-weight:700}
.exbox{border:2px dashed var(--line-strong);border-radius:14px;padding:20px;background:var(--surface-2)}
.exlbl{display:inline-block;margin-bottom:12px;padding:2px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);font:700 .74rem var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.agree{display:flex;align-items:center;gap:14px;margin-block:22px 18px;padding:14px 16px;border:2px solid var(--line-strong);border-radius:12px;background:var(--surface);font-weight:700;cursor:pointer}
.agree input{width:26px;height:26px;accent-color:var(--accent);flex:none}

/* C. Layar soal */
.thead{position:sticky;top:8px;z-index:20;display:grid;grid-template-columns:minmax(0,1fr) minmax(190px,280px) auto;gap:12px 28px;align-items:center;padding:14px 20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:20px}
.thead h1{font-size:1.5rem}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:8px 0 0;padding:0}
.steps li{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;border:1.5px solid var(--line-strong);font-size:.85rem;font-weight:700;color:var(--ink-2)}
.steps li.done{background:var(--surface-2)}
.steps li.on{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.prog b{font:600 1.3rem var(--font-mono)}
.prog .pl{font-size:1.15rem}
.pbar{height:8px;margin-top:8px;border-radius:4px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.timer{display:flex;flex-direction:column;align-items:center;min-width:164px;padding:8px 20px 10px;border-radius:12px;background:var(--navy);color:var(--on-navy)}
.timer .tl{display:flex;align-items:center;gap:6px;font:700 .72rem var(--font-head);letter-spacing:.1em;text-transform:uppercase}
.timer .tval{font:600 2.4rem/1.05 var(--font-mono);font-variant-numeric:tabular-nums}
.timer .tn{display:none;font:700 .8rem var(--font-head)}
.timer.low{background:var(--alert);color:#fff}
.timer.low .tn{display:block}

.tbody{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.qcard{padding:28px 30px}
.lead{font-size:1.15rem;color:var(--ink-2);margin-bottom:10px}
.stem{font:600 1.55rem/1.4 var(--font-head);margin-bottom:6px}
.ask{font-size:1.2rem;margin-top:8px}
.qgap{margin-top:22px}
.opts{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.opt{display:flex;align-items:center;gap:16px;width:100%;min-height:68px;padding:14px 20px;text-align:left;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:1.2rem;line-height:1.4;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt .lt{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:2px solid var(--line-strong);font:700 1.05rem var(--font-head);color:var(--ink-2)}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-tint);box-shadow:0 0 0 4px var(--accent-ring)}
.opt[aria-checked="true"] .lt{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt[aria-checked="true"]::after{content:"Dipilih";margin-left:auto;padding-left:12px;font:700 .78rem var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.opts.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:14px}
.opts.figs .opt{flex-direction:column;align-items:center;gap:10px;padding:14px 10px;min-height:0}
.opts.figs .opt::after{display:none}
.figtile{display:inline-block;background:#fff;border:1px solid #C3CBD6;border-radius:10px;padding:6px;line-height:0}
.figtile svg{width:84px;height:84px}
.figrow{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.figrow .figtile svg{width:92px;height:92px}
.figmx .figtile svg{width:min(250px,calc(100vw - 110px));height:auto}
.figmx,.figone{margin-top:16px}
.figone .figtile svg{width:130px;height:130px}
.scenario{margin-top:10px;padding:16px 18px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:1.2rem}
.scenario .sl{display:block;margin-bottom:4px;font:700 .74rem var(--font-head);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:22px}
.sc{min-height:88px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font:700 2rem var(--font-head);color:var(--ink)}
.sc:hover{border-color:var(--accent)}
.sc[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 0 0 4px var(--accent-ring)}
.sends{display:flex;justify-content:space-between;gap:16px;margin-top:10px;color:var(--ink-2);font-size:1.02rem}
.mini{border-collapse:collapse;margin:8px 0 4px;font-size:1.1rem}
.mini th,.mini td{border:1px solid var(--line-strong);padding:6px 18px;text-align:left}
.mini th{background:var(--surface-2);font-family:var(--font-head)}
.mini td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.phnote{margin-top:20px;padding:10px 14px;border:1.5px dashed var(--line-strong);border-radius:10px;color:var(--ink-2);font-size:.95rem}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-top:18px}
.actions .grp{display:flex;flex-wrap:wrap;gap:12px}

.side{position:sticky;top:132px;padding:20px}
.side h3{font-size:1.05rem;margin-bottom:12px}
.ngrid{display:grid;gap:6px}
.ngrid.c5{grid-template-columns:repeat(5,1fr)}
.ngrid.c8{grid-template-columns:repeat(8,1fr);gap:5px}
.cell{position:relative;aspect-ratio:1;min-height:32px;display:grid;place-items:center;border:2px solid var(--line-strong);border-radius:8px;background:var(--surface);font:600 .95rem var(--font-mono);color:var(--ink)}
.c8 .cell{font-size:.8rem;border-radius:6px}
.cell.ans{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.cell.flag{border-color:var(--warn-line);border-style:dashed}
.cell.ans.flag{border-style:solid}
.cell.cur{outline:3px solid var(--accent);outline-offset:2px}
.cell .fm{position:absolute;top:-2px;right:-2px;width:0;height:0;border-style:solid;border-width:0 12px 12px 0;border-color:transparent var(--warn-line) transparent transparent;border-top-right-radius:6px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;list-style:none;margin:16px 0 0;padding:0;font-size:.88rem;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:8px}
.sw{position:relative;flex:none;width:18px;height:18px;border-radius:5px;border:2px solid var(--line-strong);background:var(--surface)}
.sw.a{background:var(--navy);border-color:var(--navy)}
.sw.f{border-color:var(--warn-line);border-style:dashed}
.sw.c{outline:2px solid var(--accent);outline-offset:1px}
.counts{margin-top:14px;font-weight:700}
.rule{margin-top:10px;font-size:.9rem;color:var(--ink-2)}
.democtl{margin-bottom:16px;padding:10px 12px;border:1.5px dashed var(--line-strong);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--ink-2)}
.democtl button{min-height:34px;padding:0 12px;border-radius:8px;border:1.5px solid var(--line-strong);background:var(--surface);font:600 .85rem var(--font-head)}
.democtl button:hover{border-color:var(--navy)}

/* D, F. Transisi dan selesai */
.center{max-width:660px;margin:36px auto;text-align:center}
.center h1{font-size:1.8rem;margin-block:14px 8px}
.center p{font-size:1.15rem}
.bigic{display:grid;place-items:center;width:76px;height:76px;margin:0 auto;border-radius:50%;background:var(--ok-bg);color:var(--ok)}
.bigic .ic{width:38px;height:38px;stroke-width:2.4}
.bigic.nv{background:var(--accent-tint);color:var(--accent-ink)}
.nextbox{margin-block:22px;padding:18px 20px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-align:left}
.nextbox b{display:block;font:700 1.3rem var(--font-head);margin-bottom:2px}

/* Dialog */
.overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(8,16,32,.62)}
.dialog{width:100%;max-width:520px;padding:28px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.dialog h2{font-size:1.4rem;margin-bottom:12px}
.dialog p{margin-bottom:10px}
.dialog .big{font:600 1.6rem var(--font-mono)}
.dialog .btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;margin-top:20px}

/* Navigasi cepat */
.qnav{position:fixed;z-index:60;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 24px);padding:8px 10px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line-strong);box-shadow:0 8px 28px rgba(8,16,32,.28);font-size:14px}
.qrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.qlbl{display:inline-flex;align-items:center;padding:3px 8px;border:1.5px dashed var(--warn-line);border-radius:6px;color:var(--warn);font:700 .68rem var(--font-head);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.qb{min-height:36px;padding:0 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface-2);font:600 .92rem var(--font-head);white-space:nowrap}
.qb:hover{border-color:var(--navy)}
.qb[aria-current="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.qb.sm{min-height:30px;padding:0 10px;font-size:.84rem}
.qrow2{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.qrow2 .qt{font-size:.8rem;color:var(--ink-2);font-weight:700}

/* G. Panel panitia */
.panel{font-size:16px}
.panel h1{font-size:1.7rem}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;margin-block:16px 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1.5px solid var(--line-strong);border-radius:999px;background:var(--surface);font:600 .95rem var(--font-head)}
.chip b{font-family:var(--font-mono);font-weight:600}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.search input{min-height:42px;min-width:min(100%,290px);padding:0 14px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
table.rt{width:100%;min-width:820px;border-collapse:collapse}
.rt th{padding:12px 14px;text-align:left;background:var(--surface-2);border-bottom:1px solid var(--line);font:700 .76rem var(--font-head);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.thb{display:inline-flex;align-items:center;gap:6px;padding:0;border:0;background:none;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.thb::after{content:"\2195";opacity:.4}
th[aria-sort="ascending"] .thb::after{content:"\25B2";opacity:1;color:var(--accent-ink)}
th[aria-sort="descending"] .thb::after{content:"\25BC";opacity:1;color:var(--accent-ink)}
.rt td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.rt tbody tr{cursor:pointer}
.rt tbody tr:last-child td{border-bottom:0}
.rt tbody tr:hover td{background:var(--surface-2)}
.rt tbody tr.sel td{background:var(--accent-tint)}
.rt .nm{padding:0;border:0;background:none;font:700 1rem var(--font-head);color:var(--ink);text-align:left}
.rt .mono{font-family:var(--font-mono);font-weight:500;font-size:.92rem;color:var(--ink-2)}
.sn{font:600 1.15rem var(--font-mono)}

  S.chk={ins1:false,ins2:false};S.ex={ins1:null,ins2:null};
}
resetAnswers();

/* ---------- Navigasi layar ---------- */
function go(screen,extra){
  clearTimeout(S.tid);S.timeup=false;S.modal=null;S.screen=screen;
  if(extra)Object.assign(S,extra);
  render();window.scrollTo(0,0);
}
function startSec(key){
  S.mode='peserta';S.sec=key;S.cur=0;S.remaining=SECS[key].min*60000;S.lowAnn=false;
  go('test');
}
function finishSection(auto){
  const sec=S.sec;S.modal=null;S.timeup=false;S.navOpen=true;
  if(sec==='profil'){go('done');return;}
  const next=ORDER[ORDER.indexOf(sec)+1]||'profil';
  go('trans',{trans:{from:sec,next:next,auto:!!auto}});
}
function onTimeUp(){
  S.timeup=true;S.modal=null;render();
  S.tid=setTimeout(()=>finishSection(true),2200);
}

/* ---------- Timer ---------- */
let lastT=performance.now();
setInterval(()=>{
  const now=performance.now(),dt=now-lastT;lastT=now;
  if(S.mode!=='peserta'||S.screen!=='test'||S.timeup)return;
  S.remaining-=dt*S.speed;
  if(S.remaining<=0){S.remaining=0;updateTimer();onTimeUp();return;}
  updateTimer();
},200);
function mmss(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function updateTimer(){
  const t=$('#timer');if(!t)return;
  const low=S.remaining<120000;
  $('#tval').textContent=mmss(S.remaining);
  t.classList.toggle('low',low);
  if(low&&!S.lowAnn){S.lowAnn=true;$('#live').textContent='Sisa waktu kurang dari 2 menit.';}
}

function stats(sec){
  const n=SECS[sec].n,ans=S.ans[sec],fl=S.flag[sec];
  const un=[],fg=[];
  for(let i=0;i<n;i++){if(ans[i]===undefined)un.push(i+1);if(fl[i])fg.push(i+1);}
  return {n:n,done:n-un.length,un:un,fg:fg};
}
function gridHtml(sec){
  const n=SECS[sec].n;let h='';
  for(let i=0;i<n;i++){
    const a=S.ans[sec][i]!==undefined,f=!!S.flag[sec][i];
    h+='<button class="cell'+(a?' ans':'')+(f?' flag':'')+(i===S.cur?' cur':'')+'" data-act="goto" data-i="'+i+'" data-fid="g'+i+'" aria-label="Butir '+(i+1)+', '+(a?'sudah dijawab':'belum dijawab')+(f?', ditandai ragu-ragu':'')+'"'+(i===S.cur?' aria-current="true"':'')+'>'+(i+1)+(f?'<span class="fm" aria-hidden="true"></span>':'')+'</button>';
  }
  return h;
}

/* ---------- Panel panitia ---------- */
function visibleRows(){
  let rows=PART.filter(p=>(PS.flt==='all'||p.flag===PS.flt)&&(!PS.q||(p.nama+' '+p.id).toLowerCase().includes(PS.q.toLowerCase())));
  const sev={hijau:0,kuning:1,merah:2};
  const val=p=>PS.key==='nama'?p.nama.toLowerCase():PS.key==='id'?p.id:PS.key==='bern'?p.bern:PS.key==='pp'?p.pp:PS.key==='flag'?sev[p.flag]:PS.key==='gab'?p.gab:p.no;
  rows.sort((a,b)=>{const x=val(a),y=val(b);return (x<y?-1:x>y?1:a.no-b.no)*PS.dir;});
  return rows;
}

  const cols=[['no','No'],['id','Nomor peserta'],['nama','Nama'],['bern','Bernalar'],['pp','Profil Perilaku'],['flag','Flag'],['gab','Gabungan indikatif']];
  let h='<div class="tablewrap"><table class="rt"><thead><tr>'+cols.map(c=>'<th scope="col"'+(PS.key===c[0]?' aria-sort="'+(PS.dir>0?'ascending':'descending')+'"':'')+'><button class="thb" data-act="sort" data-k="'+c[0]+'" data-fid="th'+c[0]+'">'+c[1]+'</button></th>').join('')+'</tr></thead><tbody>';
  if(!rows.length)h+='<tr><td colspan="7"><div class="empty">Tidak ada peserta yang cocok dengan filter.</div></td></tr>';
  rows.forEach(p=>{
    h+='<tr data-act="row" data-no="'+p.no+'"'+(PS.sel===p.no?' class="sel" aria-selected="true"':'')+'>'+
      '<td class="num">'+p.no+'</td><td class="mono">'+p.id+'</td>'+
      '<td><button class="nm" data-act="row" data-no="'+p.no+'" data-fid="r'+p.no+'">'+p.nama+'</button></td>'+
      '<td><span class="sn num">'+p.bern+'</span><span class="mb b"><i style="width:'+p.bern+'%"></i></span></td>'+
      '<td><span class="sn num">'+p.pp+'</span><span class="mb p"><i style="width:'+p.pp+'%"></i></span></td>'+
      '<td>'+pill(p.flag)+'</td>'+
      '<td><span class="sn num">'+fmt(p.gab.toFixed(1))+'</span></td></tr>';
  });
  return h+'</tbody></table></div>';
}
function radarSvg(p){
  const cx=240,cy=172,R=108,low=lowest(p);
  const pt=(i,v)=>{const a=-Math.PI/2+i*Math.PI/3,r=R*v/100;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let s='<svg viewBox="0 0 480 350" role="img" aria-label="Grafik radar enam aspek Profil Perilaku Kerja">';
  [25,50,75,100].forEach(v=>{s+='<polygon points="'+[0,1,2,3,4,5].map(i=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' ')+'" fill="none" stroke="var(--line)" stroke-width="'+(v===100?1.5:1)+'"/>';});
  for(let i=0;i<6;i++){const e=pt(i,100);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';}
  s+='<polygon points="'+p.asp.map((v,i)=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' ')+'" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  p.asp.forEach((v,i)=>{const q=pt(i,v);s+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>';});
  for(let i=0;i<6;i++){
    const a=-Math.PI/2+i*Math.PI/3,lx=cx+(R+18)*Math.cos(a),ly=cy+(R+18)*Math.sin(a);
    const anchor=Math.cos(a)>.3?'start':Math.cos(a)<-.3?'end':'middle';
    const lines=ASPL[i].length+1,lh=17;
    let y0;
    if(Math.sin(a)<-.9)y0=ly-(lines-1)*lh-4;else if(Math.sin(a)>.9)y0=ly+14;else y0=ly-(lines-1)*lh/2+4;
    s+='<text x="'+lx.toFixed(1)+'" text-anchor="'+anchor+'">';
    ASPL[i].forEach((t,k)=>{s+='<tspan class="rl" x="'+lx.toFixed(1)+'" y="'+(y0+k*lh).toFixed(1)+'">'+t.replace('&','&amp;')+'</tspan>';});
    s+='<tspan class="rv'+(low.includes(i)?' lo':'')+'" x="'+lx.toFixed(1)+'" y="'+(y0+ASPL[i].length*lh).toFixed(1)+'">'+p.asp[i]+'</tspan></text>';
  }
  return s+'</svg>';
}
function detailHtml(p){
  const low=lowest(p);
  const subN=['Verbal','Numerik','Figural'];
  const vrows=(()=>{
    const v=p.v,r=[];
    r.push({l:'Cek perhatian',t:v.att[0]+' dari '+v.att[1]+' lolos',s:v.att[0]===v.att[1]?'ok':'warn'});
    const bad=v.cons[1]-v.cons[0];
    r.push({l:'Konsistensi pasangan butir',t:v.cons[0]+' dari '+v.cons[1]+' pasangan sejalan',s:bad===0?'ok':bad===1?'warn':'bad'});
    r.push({l:'Kecenderungan menjawab terlalu positif',t:'Rata-rata skala kesan baik '+fmt(v.sd.toFixed(1))+' dari 5'+(v.sd>=4.5?' (tinggi)':''),s:v.sd>=4.5?'warn':'ok'});
    return r;
  })();
  const vi={ok:'check',warn:'alert',bad:'x'};
  const reason=p.nsign===0?'Tidak ada tanda masalah pada cek perhatian, konsistensi jawaban, maupun kecenderungan menjawab terlalu positif.':
    (p.nsign===1?'Satu tanda: ':'Beberapa tanda: ')+p.signs.join('; ')+'.';
  return '<section class="card dh"><div><h2>'+p.nama+'</h2><div class="meta"><span class="mono" style="font-family:var(--font-mono)">'+p.id+'</span>'+pill(p.flag)+'</div></div>'+
    '<div class="gab"><div class="gl">Skor gabungan indikatif</div><div class="gv num">'+fmt(p.gab.toFixed(1))+'</div></div></section>'+
    '<div class="dgrid"><div class="dcol">'+
    '<section class="card dc"><h3>Tes Kemampuan Bernalar <small>benar ÷ 45 × 100</small></h3>'+
    '<div class="scorebig"><b class="num">'+p.bern+'</b><span>/ 100 · '+p.benar+' benar dari 45 butir</span></div>'+
    p.sub.map((b,i)=>'<div class="brow"><span class="bn">'+subN[i]+'</span><div class="bt b"><i style="width:'+(b/15*100)+'%"></i></div><span class="bv num">'+b+'/15</span></div>').join('')+'</section>'+
    '<section class="card dc"><h3>Flag validitas '+pill(p.flag)+'</h3>'+
    vrows.map(r=>'<div class="vrow"><span class="vi '+r.s+'">'+ic(vi[r.s])+'</span><span class="vl">'+r.l+'</span><span class="vv">'+r.t+'</span></div>').join('')+
    '<p class="reason">'+reason+'</p>'+
    '<div class="fnote"><b>Flag hanya catatan untuk pewawancara, bukan diskualifikasi otomatis.</b> Hijau = tanpa tanda · Kuning = satu tanda · Merah = beberapa tanda. Ambang batas masih sementara.</div></section>'+
    '</div><div class="dcol">'+
    '<section class="card dc"><h3>Profil Perilaku Kerja <small>rata-rata enam aspek</small></h3>'+
    '<div class="scorebig"><b class="num">'+p.pp+'</b><span>/ 100</span></div>'+
    '<div class="pfwrap"><div class="radar">'+radarSvg(p)+'</div><div class="alist">'+
    p.asp.map((v,i)=>'<div class="arow'+(low.includes(i)?' lo':'')+'"><span class="an">'+ASPH[i]+'</span><div class="bt"><i style="width:'+v+'%"></i></div><span class="bv num">'+v+'</span></div>').join('')+
    '</div></div></section>'+
    '<section class="card dc"><h3>Saran bahan wawancara <small>aspek dengan skor terendah</small></h3><div class="saran">'+
    low.map(i=>'<div class="sa"><h4>'+ASPH[i]+'<span class="num">'+p.asp[i]+'</span></h4><p>'+SARAN[i]+'</p></div>').join('')+
    '</div></section></div></div>';
}
function panelHtml(){
  const cnt=f=>f==='all'?PART.length:PART.filter(p=>p.flag===f).length;
  const chips=[['all','Semua'],['hijau','Hijau'],['kuning','Kuning'],['merah','Merah']].map(c=>'<button class="chip" data-act="flt" data-v="'+c[0]+'" data-fid="f'+c[0]+'" aria-pressed="'+(PS.flt===c[0])+'">'+c[1]+' <b>'+cnt(c[0])+'</b></button>').join('');
  return '<div class="panel"><div class="phead"><div><p class="eyebrow">Untuk panitia dan pewawancara</p><h1>Hasil peserta</h1></div></div>'+
    '<div class="toolbar"><div class="chips" role="group" aria-label="Filter flag validitas">'+chips+'</div>'+
    '<label class="search"><span class="sr">Cari peserta</span><input id="q" type="search" placeholder="Cari nama atau nomor peserta" value="'+PS.q.replace(/"/g,'&quot;')+'"></label></div>'+
    '<div id="ptable">'+tableHtml()+'</div>'+
    '<p class="note">'+ic('info')+'<span>Bobot tiap tes terhadap nilai total CBT belum ditetapkan; skor gabungan di demo = rata-rata sederhana. Klik baris untuk melihat detail peserta.</span></p>'+
    '<div id="pdetail">'+detailHtml(PART.find(p=>p.no===PS.sel))+'</div></div>';
}

/* ---------- Render ---------- */
const SCREENS={home:screenHome,ins1:screenIns1,ins2:screenIns2,test:screenTest,trans:screenTrans,done:screenDone};
function render(){
  const ae=document.activeElement;
  const fid=ae&&ae.dataset?ae.dataset.fid:null;
  const inQ=ae&&ae.id==='q';
  $('#app').dataset.mode=S.mode;
  $('#topbar').innerHTML=topbarHtml();
  if(!inQ)$('#stage').innerHTML=S.mode==='panitia'?panelHtml():SCREENS[S.screen]();
  $('#qnav').innerHTML=navHtml();
  overlayRender();
  if(S.modal==='finish'){const d=$('[data-fid="dcancel"]');if(d)d.focus();}
  else if(fid){const el=document.querySelector('[data-fid="'+fid+'"]');if(el)el.focus({preventScroll:true});}
  if(S.mode==='peserta'&&S.screen==='test')updateTimer();
}
function renderTable(){$('#ptable').innerHTML=tableHtml();}
function renderPanelParts(){$('#ptable').innerHTML=tableHtml();$('#pdetail').innerHTML=detailHtml(PART.find(p=>p.no===PS.sel));}

/* ---------- Aksi ---------- */
const H={
  start(){go('ins1');},
  ex1(t){S.ex.ins1=+t.dataset.v;render();},
  ex2(t){S.ex.ins2=+t.dataset.v;render();},
  begin(t){S.navOpen=false;S.navMore=false;startSec(t.dataset.sec);},
  pick(t){S.ans[S.sec][S.cur]=+t.dataset.v;render();},
  prev(){if(S.cur>0){S.cur--;render();window.scrollTo(0,0);}},
  next(){if(S.cur<SECS[S.sec].n-1){S.cur++;render();window.scrollTo(0,0);}},
  goto(t){S.cur=+t.dataset.i;render();window.scrollTo(0,0);},
  flag(){const f=S.flag[S.sec];if(f[S.cur])delete f[S.cur];else f[S.cur]=true;render();},
  finish(){S.modal='finish';render();},
  cancel(){S.modal=null;render();const b=$('[data-fid="finish"]');if(b)b.focus();},
  confirm(){finishSection(false);},
  speed(){const sp=[1,10,60];S.speed=sp[(sp.indexOf(S.speed)+1)%sp.length];render();},
  transnext(){if(S.trans.next==='profil')go('ins2');else{S.navOpen=false;S.navMore=false;startSec(S.trans.next);}},
  mode(){S.mode=S.mode==='panitia'?'peserta':'panitia';render();window.scrollTo(0,0);},
  nav(t){
    const to=t.dataset.to;
    if(to==='panel'){S.mode='panitia';render();window.scrollTo(0,0);return;}
    S.mode='peserta';
    if(to==='home')resetAnswers();
    go(to);
  },
  navsec(t){startSec(t.dataset.sec);},
  navtoggle(){S.navOpen=!S.navOpen;render();},
  navmore(){S.navMore=!S.navMore;render();},
  sort(t){const k=t.dataset.k;if(PS.key===k)PS.dir=-PS.dir;else{PS.key=k;PS.dir=(k==='bern'||k==='pp'||k==='gab')?-1:1;}renderTable();const b=document.querySelector('[data-fid="th'+k+'"]');if(b)b.focus();},
  flt(t){PS.flt=t.dataset.v;render();},
  row(t){PS.sel=+t.dataset.no;renderPanelParts();}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t||t.disabled)return;
  const f=H[t.dataset.act];if(f)f(t,e);
});
document.addEventListener('change',e=>{
  const c=e.target.closest('[data-chk]');
  if(c){S.chk[c.dataset.chk]=c.checked;render();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){PS.q=e.target.value;renderTable();}
});
document.addEventListener('keydown',e=>{
  if(S.modal==='finish'){
    if(e.key==='Escape'){H.cancel();return;}
    if(e.key==='Tab'){
      const bs=[...document.querySelectorAll('#overlay button')];if(!bs.length)return;
      const i=bs.indexOf(document.activeElement);
      e.preventDefault();
      bs[(i+(e.shiftKey?-1:1)+bs.length)%bs.length].focus();
    }
    return;
  }
  if(S.mode!=='peserta'||S.screen!=='test'||S.timeup)return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||e.ctrlKey||e.metaKey||e.altKey)return;
  const it=ITEMS[S.sec][S.cur];
  if(e.key==='ArrowRight'){H.next();return;}
  if(e.key==='ArrowLeft'){H.prev();return;}
  let v=null;
  if(it.t==='lk'&&/^[1-5]$/.test(e.key))v=+e.key;
  else if(it.t!=='lk'){
    const max=it.t==='sjt'?4:5,ix='abcde'.indexOf(e.key.toLowerCase());
    if(ix>=0&&ix<max&&e.key.length===1)v=ix;
  }
  if(v!==null){S.ans[S.sec][S.cur]=v;render();}
});

S.navOpen=window.innerWidth>=700;
render();
})();
</script>
